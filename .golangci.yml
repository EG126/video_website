version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - gosec
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gofmt:
      simplify: true
  disable:
    - gochecknoglobals
    - gochecknoinits
    - gocyclo
    - dupl
    - funlen
    - lll
    - prealloc

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unused
    - path: vendor/
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0
