version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - gosec
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  disable:
    - gochecknoglobals
    - gochecknoinits
    - gocyclo
    - dupl
    - funlen
    - lll
    - prealloc
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
      - path: vendor/
        linters:
          - all

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
