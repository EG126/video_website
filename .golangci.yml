version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - bodyclose
  disable:
    - gochecknoglobals
    - gochecknoinits
    - gocyclo
    - dupl
    - funlen
    - lll
    - prealloc
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
      # 忽略 Close 函数的错误返回值检查
      - linters:
          - errcheck
        text: "Error return value of `.*Close` is not checked"
      # G115: 忽略整数溢出转换警告
      - linters:
          - gosec
        text: "G115:"
      # G306: 忽略文件权限警告
      - linters:
          - gosec
        text: "G306:"
      # G706: 忽略日志注入警告
      - linters:
          - gosec
        text: "G706:"
      # G118: 忽略 context 取消函数未调用警告
      - linters:
          - gosec
        text: "G118:"
      # G104: 忽略未处理错误警告
      - linters:
          - gosec
        text: "G104:"


issues:
  max-issues-per-linter: 0
  max-same-issues: 0
