version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - unused
  disable:
    - gochecknoglobals
    - gochecknoinits
    - gocyclo
    - dupl
    - funlen
    - lll
    - prealloc
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
      - path: vendor/
        linters:
          - all
      - linters:
          - errcheck
        text: "Error return value of `.*Close` is not checked"
      - linters:
          - gosec
        text: "G115:"
      - linters:
          - gosec
        text: "G306:"
      - linters:
          - gosec
        text: "G706:"
      - linters:
          - gosec
        text: "G118:"
      - linters:
          - gosec
        text: "G104:"
      - linters:
          - staticcheck
        text: "QF1003:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
